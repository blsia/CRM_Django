[build]
  command = "pip install -r requirements.txt && python manage.py collectstatic --noinput"
  publish = "staticfiles"
  functions = "functions"

# 1. Pengecualian untuk static files
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# 2. Tangkap semua request lain ke Serverless Function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true