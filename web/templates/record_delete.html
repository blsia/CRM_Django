{% extends "base.html" %}
{% block content %}

<main class="mx-auto max-w-lg px-4 py-8 sm:px-6 lg:px-8 pt-24">
  <div class="overflow-hidden rounded-2xl bg-white border border-slate-200 shadow-sm">
    <div class="px-6 py-10 text-center">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-50">
        <svg class="h-8 w-8 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
      </div>
      <h1 class="mt-6 text-xl font-bold text-slate-900">Delete this record?</h1>
      <p class="mt-2 text-sm text-slate-500">
        You are about to permanently delete
        <span class="font-semibold text-slate-700">{{ record.first_name }} {{ record.last_name }}</span>
        ({{ record.email }}).
        <br>This action cannot be undone.
      </p>

      <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">
        <a href="{% url 'records_list' %}" class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition-colors hover:bg-slate-50">
          Cancel
        </a>
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-rose-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-rose-700 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            Delete Record
          </button>
        </form>
      </div>
    </div>
  </div>
</main>

{% endblock content %}
