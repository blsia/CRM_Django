<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>django crm</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 antialiased">

    {% include "navbar.html" %}
    <div class= "container">
            {% if messages %}
            <div class="max-w-4xl mx-auto my-4 px-4">
                {% for message in messages %}
                <div class="p-4 rounded-md border {% if message.tags == 'error' %}bg-red-100 border-red-400 text-red-900{% else %}bg-green-100 border-green-400 text-green-900{% endif %}">
                    <p class="font-medium text-sm">
                    {{ message }}
                    </p>
                </div>
                {% endfor %}
            </div>
            {% endif %}
    {% block content %}
            <h1>HIIII</h1>
    {% endblock %}
    </div>

  </body>
</html>
